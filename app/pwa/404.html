<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — RévizSTMG</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!--
    Page servie par GitHub Pages pour toute adresse qui n'existe pas. L'app utilise
    des adresses en « #/… » : quelqu'un qui tape revizstmg.github.io/cgu est envoyé
    sur revizstmg.github.io/#/cgu. La liste ROUTES doit suivre les routes de
    src/App.jsx (vérifié par tests/liens.test.js).
  -->
  <script>
    (function () {
      var ROUTES = ['accueil', 'changer', 'subject', 'favoris', 'badges', 'classe', 'moi', 'coach', 'revision', 'parent',
        'bac-blanc', 'programme', 'grand-oral', 'coach-ia', 'fiches-photo', 'defi', 'express', 'formules', 'methodo',
        'boutique', 'confidentialite', 'cgu', 'faq', 'guide', 'classement', 'amis']
      var chemin = location.pathname.replace(/\/+$/, '').replace(/\.html$/, '')
      if (ROUTES.indexOf(chemin.split('/')[1]) !== -1) location.replace('/#' + chemin + location.search)
    })()
  </script>
  <style>
    :root { color-scheme: light dark; --fond: #f5f1e8; --carte: #fffdf8; --encre: #1c1813; --doux: #5f594f; --or: #7c6430; --bouton: #84671b; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #14110c; --carte: #201c15; --encre: #f1e9dc; --doux: #c9bfae; --or: #d9bd77; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--fond); color: var(--encre);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.5;
    }
    main { width: 100%; max-width: 420px; padding: 32px 24px; text-align: center; background: var(--carte); border-radius: 24px; box-shadow: 0 0 0 1px rgba(200, 162, 78, 0.3), 0 20px 50px -30px rgba(0, 0, 0, 0.45); }
    .marque { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 1.5rem; }
    .marque span { color: var(--or); }
    .code { margin: 20px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 4rem; line-height: 1; color: var(--or); }
    h1 { margin: 8px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 1.5rem; font-weight: 600; }
    p { margin: 8px 0 0; color: var(--doux); font-size: 0.95rem; }
    a.bouton { display: inline-block; margin-top: 24px; padding: 12px 24px; border-radius: 999px; background: var(--bouton); color: #fff; font-weight: 600; text-decoration: none; }
    a.bouton:hover, a.bouton:focus-visible { background: #6d5516; }
    a.bouton:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="marque">Réviz<span>STMG</span></p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page introuvable</h1>
    <p>Cette adresse ne correspond à aucune page : le lien est peut-être incomplet ou ancien.</p>
    <a class="bouton" href="/">Retour à l’accueil</a>
  </main>
</body>
</html>
