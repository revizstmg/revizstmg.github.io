name: Publier Pages vérifié

on:
  push:
    branches: [main]
    paths: [.github/workflows/relancer-pages.yml]
  workflow_dispatch:
    inputs:
      empreinte_index:
        description: SHA-256 de l’index compilé déjà testé
        required: true
        default: a501574700371f8e028e44a24435d8d8ef1552e57591cd48bd65f70a344e2484
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: relancer-pages-verifie
  cancel-in-progress: false

jobs:
  reconstruire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la compilation attendue
        env:
          EMPREINTE_ATTENDUE: ${{ inputs.empreinte_index || 'a501574700371f8e028e44a24435d8d8ef1552e57591cd48bd65f70a344e2484' }}
        run: |
          set -eu
          [[ "$EMPREINTE_ATTENDUE" =~ ^[0-9a-f]{64}$ ]]
          empreinte_reelle=$(sha256sum index.html | cut -d ' ' -f 1)
          test "$empreinte_reelle" = "$EMPREINTE_ATTENDUE"
      - name: Inclure les PDF EPS vérifiés
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('app/public/eps')
          target = pathlib.Path('eps')
          documents = json.loads(pathlib.Path('app/content/eps/sources.json').read_text())['documents']
          assert len(documents) == 3
          target.mkdir(exist_ok=True)
          for document in documents:
              name = document['file']
              assert pathlib.Path(name).name == name and name.endswith('.pdf')
              data = (source / name).read_bytes()
              assert data.startswith(b'%PDF-')
              assert hashlib.sha256(data).hexdigest() == document['sha256']
              shutil.copyfile(source / name, target / name)
          PYTHON
      - name: Préparer les fichiers Pages vérifiés
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier la version vérifiée
        id: deployment
        uses: actions/deploy-pages@v4
