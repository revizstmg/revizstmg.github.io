name: Publier Pages vérifié

on:
  push:
    branches: [main]
    paths: [.github/workflows/relancer-pages.yml]
  workflow_dispatch:
    inputs:
      empreinte_index:
        description: SHA-256 de l’index compilé déjà testé
        required: true
        default: c924cef174de0f546e68bd3d6d483732b7d3e00058655f324836eef8997be5a9
        type: string

      annuler_deploiement:
        description: SHA exact d’un ancien déploiement Pages bloqué (facultatif)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: relancer-pages-verifie
  cancel-in-progress: false

jobs:
  reconstruire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la compilation attendue
        env:
          EMPREINTE_ATTENDUE: ${{ inputs.empreinte_index || 'c924cef174de0f546e68bd3d6d483732b7d3e00058655f324836eef8997be5a9' }}
        run: |
          set -eu
          [[ "$EMPREINTE_ATTENDUE" =~ ^[0-9a-f]{64}$ ]]
          empreinte_reelle=$(sha256sum index.html | cut -d ' ' -f 1)
          test "$empreinte_reelle" = "$EMPREINTE_ATTENDUE"
      - name: Annuler uniquement l’ancien déploiement désigné
        if: github.event_name == 'workflow_dispatch' && inputs.annuler_deploiement != ''
        uses: actions/github-script@v7
        env:
          ANCIEN_DEPLOIEMENT: ${{ inputs.annuler_deploiement }}
        with:
          script: |
            const previous = process.env.ANCIEN_DEPLOIEMENT;
            if (!/^[a-f0-9]{40}$/.test(previous) || previous === context.sha) {
              throw new Error('Identifiant ancien invalide ou identique à la version courante');
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              ...context.repo, pages_deployment_id: previous
            });
      - name: Inclure les PDF EPS vérifiés
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('app/public/eps')
          target = pathlib.Path('eps')
          documents = json.loads(pathlib.Path('app/content/eps/sources.json').read_text())['documents']
          assert len(documents) == 3
          target.mkdir(exist_ok=True)
          for document in documents:
              name = document['file']
              assert pathlib.Path(name).name == name and name.endswith('.pdf')
              data = (source / name).read_bytes()
              assert data.startswith(b'%PDF-')
              assert hashlib.sha256(data).hexdigest() == document['sha256']
              shutil.copyfile(source / name, target / name)
          PYTHON
      - name: Préparer les fichiers Pages vérifiés
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier la version vérifiée
        id: deployment
        uses: actions/deploy-pages@v4
