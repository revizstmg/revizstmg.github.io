name: Tester et publier

# Sur chaque branche : tests de la logique et du contenu, compilation, puis
# parcours dans un vrai navigateur. Sur main uniquement, et seulement si tout
# est vert : la version compilée est déposée à la racine du dépôt, que GitHub
# Pages sert sur https://revizstmg.github.io (réglage Pages : « Deploy from a
# branch », main, /).
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # Playwright 1.56.1 prend en charge Ubuntu 24.04 ; éviter les migrations
    # automatiques de ubuntu-latest avant une mise à jour du navigateur.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests de la logique et du contenu
        run: npm test

      # Les élèves sont à l'heure de Paris : les mêmes tests y repassent, pour
      # qu'une date calculée en heure universelle ne passe plus inaperçue.
      - name: Tests de la logique à l'heure de Paris
        run: npm test
        env:
          TZ: Europe/Paris

      - name: Compiler
        run: npm run build

      - name: Installer le navigateur des parcours
        run: |
          # Le miroir Azure peut être très lent sur certains runners.
          # Garder les mêmes paquets Ubuntu, depuis le miroir standard.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$source"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Parcours dans le navigateur
        run: npm run test:parcours

      - name: Garder le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-parcours
          path: app/test-results/
          retention-days: 7

      - name: Garder la version compilée
        uses: actions/upload-artifact@v4
        with:
          name: version-compilee
          path: app/dist/
          retention-days: 1

  publier:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publier
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la version compilée et testée
        uses: actions/download-artifact@v4
        with:
          name: version-compilee
          path: dist

      - name: Déposer la version compilée à la racine
        id: publish
        run: |
          set -e
          # Garde aussi les fichiers de la version précédente (voir le script).
          node app/scripts/publier.mjs dist .
          rm -rf dist
          git add -A
          if git diff --cached --quiet; then
            echo "La version en ligne est déjà à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "revizstmg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publication automatique (${GITHUB_SHA::7})"
          # Si quelqu'un a poussé pendant les tests, on se replace dessus.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un envoi fait par le workflow lui-même ne relance pas toujours GitHub
      # Pages : on demande la reconstruction explicitement.
      - name: Reconstruire GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
